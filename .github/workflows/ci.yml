name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: Lint, test, and typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

  web:
    name: Static web, routes, and board
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome
        run: |
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get update
          sudo apt-get install -y /tmp/chrome.deb

      - name: Export the static site
        run: npm run export:web

      - name: Serve the preview and check routes and the board
        run: |
          node scripts/preview-web.mjs > preview.log 2>&1 &
          pid=$!
          ready=0
          for _ in $(seq 1 50); do
            if curl -sf -o /dev/null http://127.0.0.1:43127/privacy; then
              ready=1
              break
            fi
            sleep 0.2
          done
          if [ "$ready" != 1 ]; then
            cat preview.log
            exit 1
          fi
          node scripts/smoke-web.mjs
          smoke=$?
          CHROME_PATH=/usr/bin/google-chrome-stable BOARD_URL=http://127.0.0.1:43127 BOARD_SHOTS="${RUNNER_TEMP}/board-shots" node scripts/board-stability.mjs
          board=$?
          kill "$pid"
          exit $((smoke || board))
